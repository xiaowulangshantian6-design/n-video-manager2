<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>N Video Manager - Safari版</title>
<style>
:root{color-scheme:dark;--bg:#0d1119;--panel:#192231;--line:#34445a;--blue:#78aaff;--muted:#aab7c9}
*{box-sizing:border-box}body{margin:0;padding:22px 16px 40px;background:var(--bg);color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
main{max-width:720px;margin:auto}h1{font-size:1.55rem;margin:0 0 6px}.sub{color:var(--muted);margin:0 0 20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
.pick{display:block;padding:18px;border:1px dashed #7186a5;border-radius:13px;text-align:center;background:#202d40}
input{display:block;width:100%;margin-top:12px;color:#eaf1fb}
video{display:block;width:100%;max-height:360px;background:#000;border-radius:12px;margin-top:16px}
.meta{white-space:pre-line;line-height:1.8;color:#c4d0df;margin-top:14px;overflow-wrap:anywhere}
button{width:100%;border:0;border-radius:12px;padding:15px;margin-top:10px;background:var(--blue);color:#071426;font-weight:750;font-size:1rem}
button.secondary{background:#33445e;color:#f5f8ff}button:disabled{opacity:.4}
.note{font-size:.91rem;line-height:1.7;color:#c5d0df}.warn{border-left:4px solid #e6b45e;padding-left:12px;color:#f0d9ac}
#status{white-space:pre-wrap;margin-top:12px;line-height:1.6;color:#dce8f8}
</style>
</head>
<body>
<main>
<h1>🎞️ N Video Manager</h1>
<p class="sub">Safari用・動画の読み込みと元データ保存</p>
<section class="panel">
<h2>① 写真アプリから動画を選択</h2>
<label class="pick">動画を選ぶ<input id="picker" type="file" accept="video/*"></label>
<div id="meta" class="meta">動画はまだ選択されていません。</div>
<video id="player" controls playsinline hidden></video>
</section>
<section class="panel">
<h2>② 保存・共有</h2>
<p class="note">MP4動画は変換せず、元の画質・音質のまま共有します。</p>
<button id="share" disabled>共有メニューを開く</button>
<button id="download" class="secondary" disabled>ダウンロード</button>
<div id="status" role="status"></div>
</section>
<section class="panel">
<h2>大容量動画について</h2>
<p class="note warn">2.48GBの動画は、iPhoneの空き容量・Safariのメモリ制限・iOSの共有機能によって処理できない場合があります。このページは動画をサーバーへ送信せず、MP4変換もしません。</p>
<p class="note">共有メニューが開いたら「ファイルに保存」を選んでください。共有できない場合は、写真アプリで動画を開き「共有」→「ファイルに保存」を使うのが確実です。</p>
</section>
</main>
<script>
const picker=document.getElementById('picker'),player=document.getElementById('player');
const meta=document.getElementById('meta'),shareBtn=document.getElementById('share');
const downloadBtn=document.getElementById('download'),status=document.getElementById('status');
let file=null,objectUrl=null;
function humanSize(n){let u=['B','KB','MB','GB','TB'],i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i?2:0)+' '+u[i]}
function duration(s){if(!Number.isFinite(s))return '取得できません';let h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.floor(s%60);return h?`${h}時間${m}分${x}秒`:`${m}分${x}秒`}
picker.addEventListener('change',()=>{
 file=picker.files?.[0]||null;status.textContent='';
 if(objectUrl)URL.revokeObjectURL(objectUrl);
 objectUrl=null;player.hidden=true;player.removeAttribute('src');
 if(!file){meta.textContent='動画はまだ選択されていません。';shareBtn.disabled=downloadBtn.disabled=true;return}
 if(!file.type.startsWith('video/')){file=null;meta.textContent='動画ファイルを選択してください。';shareBtn.disabled=downloadBtn.disabled=true;return}
 objectUrl=URL.createObjectURL(file);player.src=objectUrl;player.hidden=false;
 let lines=[`ファイル名：${file.name}`,`形式：${file.type||'不明'}`,`容量：${humanSize(file.size)}`,`再生時間：読み込み中…`];
 meta.textContent=lines.join('\n');
 player.addEventListener('loadedmetadata',()=>{lines[3]=`再生時間：${duration(player.duration)}`;meta.textContent=lines.join('\n')},{once:true});
 shareBtn.disabled=downloadBtn.disabled=false;
});
shareBtn.addEventListener('click',async()=>{
 if(!file)return;
 try{
  if(!navigator.share||!navigator.canShare||!navigator.canShare({files:[file]})){
   status.textContent='このSafari環境ではファイル共有に対応していません。写真アプリから直接「共有」→「ファイルに保存」をお試しください。';return;
  }
  await navigator.share({files:[file],title:file.name});
  status.textContent='共有メニューを開きました。「ファイルに保存」を選んでください。';
 }catch(e){status.textContent=e.name==='AbortError'?'共有をキャンセルしました。':'共有できませんでした。写真アプリから直接「ファイルに保存」をお試しください。'}
});
downloadBtn.addEventListener('click',()=>{
 if(!file)return;
 const a=document.createElement('a');a.href=objectUrl;a.download=file.name;document.body.append(a);a.click();a.remove();
 status.textContent='ダウンロードを要求しました。Safariのダウンロード項目または「ファイル」アプリを確認してください。';
});
</script>
</body></html>
